name: AWS - Java CI with Maven

on:
  pull_request:
    branches:
      - AWS-Infrastructure
    types:
      - closed

jobs:
  on-merge:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    env:
      AWS_REGION: eu-west-1
      ECR_REGISTRY: 991776826412.dkr.ecr.eu-west-1.amazonaws.com
      ECR_REPOSITORY: java-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Update project patch version with GitHub Run Number
        run: |
          mvn versions:set -DnewVersion=1.0.${{ github.run_number }} -DgenerateBackupPoms=false

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:1.0.${{ github.run_number }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy and verify container
        run: |
          docker rm -f java-app-verify 2>/dev/null || true
          output=$(docker run --name java-app-verify --rm ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:1.0.${{ github.run_number }})
          echo "$output"
          echo "$output" | grep -qF "Hello World!"
